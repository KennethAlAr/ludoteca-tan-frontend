<mat-toolbar>
    <mat-toolbar-row>
        <div class="header_container">
            <div class="header_title">              
                <mat-icon>storefront</mat-icon> Ludoteca Tan
            </div>

            <div class="header_separator"> | </div>

            <div class="header_menu">
                <div class="header_button">
                    <a routerLink="/games" routerLinkActive="active">Catálogo</a>
                </div>
                <div class="header_button">
                    <a routerLink="/categories" routerLinkActive="active">Categorías</a>
                </div>
                <div class="header_button">
                    <a routerLink="/authors" routerLinkActive="active">Autores</a>
                </div>
                <div class="header_button">
                    <a routerLink="/clients" routerLinkActive="active">Clientes</a>
                </div>                
                <div class="header_button">
                    <a routerLink="/reservations" routerLinkActive="active">Reservas</a>
                </div>
            </div>
            
            @if (loginService.isAdmin()) {
                <div class="header_user">
                    <div>Usuario {{loginService.getUserName()}}</div>
                    <div class="header_login" (click)="logout()"><mat-icon>account_circle</mat-icon> Log out</div>
                </div>
            } @else {
                <div class="header_user">
                    <div>No estás logueado ¡Conéctate!</div>
                    <div class="header_login" (click)="login()"><mat-icon>account_circle</mat-icon> Log in</div>
                </div>
            }            
        </div>
    </mat-toolbar-row>
</mat-toolbar>
