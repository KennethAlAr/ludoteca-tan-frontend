<div class="container">
    <h1>Listado de Categorías</h1>

    <mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="id">
            <mat-header-cell *matHeaderCellDef> Identificador </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.id}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="name">
            <mat-header-cell *matHeaderCellDef> Nombre categoría  </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.name}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="action">
            <mat-header-cell *matHeaderCellDef></mat-header-cell>
            <mat-cell *matCellDef="let element">
                <button mat-icon-button color="primary" (click)="editCategory(element)"><mat-icon>edit</mat-icon></button>
                <!-- He añadido una clase "clear-icon" para poder ponerle el color de la variable --mat-sys-error.
                 El tema Azure/blue que estoy utilizando no aplica colores a los mat-icon-button y me parecía interesante ver este botón en rojo -->
                <button mat-icon-button (click)="deleteCategory(element)"><mat-icon class="clear-icon">clear</mat-icon></button>
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <div class="buttons">
        <button mat-flat-button color="primary" (click)="createCategory()">Nueva categoría</button>
    </div>   
</div>
